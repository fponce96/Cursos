name: Generar PDFs INSYCOM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Curso-Introduccion-Redes-ISP/INSYCOM-Curso-Instaladores.md'
      - 'Curso-Introduccion-Redes-ISP/scripts/generar_pdfs.py'
      - '.github/workflows/generar-pdfs-insycom.yml'
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==4.4.4
      - run: python Curso-Introduccion-Redes-ISP/scripts/generar_pdfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: PDFs-Curso-INSYCOM
          path: Curso-Introduccion-Redes-ISP/pdf/*.pdf
      - name: Publicar PDFs en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Curso-Introduccion-Redes-ISP/pdf/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publicar PDFs generados del curso INSYCOM"
            git push
          fi
